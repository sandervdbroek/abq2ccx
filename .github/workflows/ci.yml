name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash        # on every OS, with pipefail

jobs:
  pyflakes:
    name: pyflakes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # a CI tool, not a dependency of abq2ccx; pinned, as a new release can warn of more
      - name: pyflakes
        run: |
          python -m pip install pyflakes==3.0.1
          python -m pyflakes $(git ls-files '*.py')

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python and the newest.  Ubuntu stays on 24.04: setup-python
        # has no Python 3.9 for later Ubuntu releases.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true      # "3.x": the newest release, not the runner's cached one
      - name: Unit tests
        run: python tests/test_convert.py
      - name: Generated references match the code
        run: |
          python docs/generate_reference.py
          git diff --exit-code
      - name: Install with pip and run the abq2ccx command
        run: |
          python -m pip install .
          python -c "import importlib.metadata as m, abq2ccx; assert m.version('abq2ccx') == abq2ccx.__version__"
          abq2ccx --version
          abq2ccx examples/nle10_thickplate.inp --outdir ci-out --quiet
          test -s ci-out/nle10_thickplate_ccx.inp

  validate:
    name: validate_with_ccx.py (${{ matrix.name }}, ccx 2.23)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            python: "3.x"
            ccx: bin/ccx
          # Python 3.13 reads and writes files in the code page (cp1252) unless told otherwise,
          # as Pythons before 3.15 do, and the runner image has it (3.9 takes 35 s to install);
          # conda installs Windows programs under Library\bin
          - name: Windows
            os: windows-latest
            python: "3.13"
            ccx: Library/bin/ccx.exe
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # conda-forge's calculix 2.23 build 2 is the build FreeCAD 1.1.4 bundles, the ccx the
      # converter is validated on (on Windows built by MinGW GCC against the UCRT); OpenBLAS
      # on both, where Windows would default to MKL
      - uses: mamba-org/setup-micromamba@v3
        id: calculix
        with:
          environment-name: ccx
          create-args: >-
            --channel conda-forge
            calculix=2.23=*_2
            libblas=*=*openblas
          init-shell: none
      - name: validate_with_ccx.py
        env:
          CCX: ${{ steps.calculix.outputs.environment-path }}/${{ matrix.ccx }}
        run: |
          # $CCX as --run finds it: on Windows with its conda environment's folders on PATH,
          # where conda's Windows ccx finds its ARPACK DLL (Library\mingw-w64\bin)
          python - <<'EOF'
          import abq2ccx, os, subprocess, sys
          exe, extra = abq2ccx.find_ccx()
          if not exe:
              sys.exit("no ccx at " + os.environ["CCX"])
          env = dict(os.environ, **extra)
          version = abq2ccx.ccx_version(exe, env)
          print("ccx", version, "at", exe)
          for d in abq2ccx._conda_dll_dirs(exe) or [os.path.dirname(exe)]:
              print(" ", d, sorted(f for f in os.listdir(d) if f.lower().endswith(".dll")))
          if version != "2.23":
              p = subprocess.run([exe, "-v"], env=env, capture_output=True)
              sys.exit(f"{abq2ccx._exit_code_text(p.returncode)}: {p.stdout!r} {p.stderr!r}")
          EOF
          [ "$RUNNER_OS" = Windows ] || ulimit -f 4194304      # Windows has no file-size limit
          python validate_with_ccx.py | tee validate.log    # fails on a SKIP not on its expected list
          python -c "import os, sys; sys.exit('Using ccx: ' + os.path.abspath(os.environ['CCX']) not in open('validate.log', errors='replace').read())"
          # every SKIP line in the SKIP total
          python - <<'EOF'
          import re, sys
          log = open("validate.log", errors="replace").read()
          n = len(re.findall(r"^SKIP  ", log, re.M))
          if not re.search(rf"^SKIP total: {n}\b", log, re.M):
              sys.exit(f"{n} SKIP lines in validate.log, but its SKIP total differs")
          EOF
      - name: abq2ccx --run
        env:
          CCX: ${{ steps.calculix.outputs.environment-path }}/${{ matrix.ccx }}
        run: |
          python -m pip install .
          abq2ccx examples/nle10_thickplate.inp --outdir ci-run --run 2>&1 | tee run.log
          grep -F "results digest from nle10_thickplate_ccx.frd and nle10_thickplate_ccx.dat:" run.log
